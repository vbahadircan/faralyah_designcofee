# Run from deploy/:  docker compose up -d --build
# Only Caddy publishes ports. Docker bypasses UFW for published ports, so never add `ports:` elsewhere.

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: faralyah
      APP_DB_USER: faralyah
      APP_DB_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGODB_URI: mongodb://faralyah:${MONGO_APP_PASSWORD}@mongo:27017/faralyah?authSource=faralyah
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - uploads:/app/uploads

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - uploads:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mongo_data:
  uploads:
  caddy_data:
  caddy_config:
